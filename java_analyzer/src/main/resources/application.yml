server:
  port: 8081

spring:
  application:
    name: argus-java-analyzer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

argus:
  analysis:
    cache:
      ttl-minutes: 30
      max-entries: 128
    jobs:
      threads: 2
      queue-capacity: 32
      max-entries: 1000
      retention-seconds: 1800
      cleanup-interval-ms: 60000
    workers:
      # 0 = min(8, max(2, available processors))
      threads: 0
      queue-capacity: 64
    # 源码路径边界（fail-closed）：
    # 逗号分隔的允许根目录，空值 = 宽松模式（兼容旧行为，启动时 SourceLocator 告警）。
    # 分析入口（analyze / validate-source）统一经过 real-path 校验：符号链接逃逸、
    # 允许根目录外的路径一律拒绝。容器部署必须显式配置；Dockerfile ENTRYPOINT
    # 已强制 /tmp/sources，Compose 也可通过 SPRING_APPLICATION_JSON 覆盖。
    allowed-source-roots: ${ARGUS_ANALYSIS_ALLOWED_SOURCE_ROOTS:}
