server:
  port: 8081

spring:
  application:
    name: argus-java-analyzer
  # 同步 /analyze 在请求线程内执行分钟级分析：虚拟线程承载请求，
  # 避免长任务挤占平台线程池、拖垮健康探针。显式 executor bean 不受影响。
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

argus:
  analysis:
    cache:
      ttl-minutes: 30
      max-entries: 128
      # O-08 权重预算（字节）：同时约束条目数、总权重与单条目权重。
      # max-total-weight-bytes 控制缓存整体堆占用；超过
      # max-single-entry-weight-bytes 的单个超大响应直接不缓存。
      # 默认值需用真实大型项目 + 受限 -Xmx 压测后调优（估算偏差只影响命中率）。
      max-total-weight-bytes: 67108864
      max-single-entry-weight-bytes: 16777216
    jobs:
      threads: 2
      queue-capacity: 32
      max-entries: 1000
      retention-seconds: 1800
      cleanup-interval-ms: 60000
      # O-04 服务端 deadline：请求未携带 timeoutSeconds 时使用默认值；
      # 请求携带的上限不得超过 max-timeout-seconds。Python 断联后由
      # deadline-check 定时任务把超时作业置 TIMED_OUT 并终止 Maven 进程树。
      default-timeout-seconds: 1800
      max-timeout-seconds: 3600
      deadline-check-ms: 5000
    workers:
      # 0 = min(8, max(2, available processors))
      threads: 0
      queue-capacity: 64
    scan:
      # 0 = min(8, available processors)。源码扫描 parse 阶段（CPU 密集、
      # 天然可并行）的分片并行度；符号求解阶段不受此值影响。
      parse-threads: 0
    # 源码路径边界（fail-closed）：
    # 逗号分隔的允许根目录。裸机默认只允许 Python 默认快照目录
    # ${java.io.tmpdir}/argus_sources；确需其它目录时必须显式配置环境变量。
    # 分析入口（analyze / validate-source）统一经过 real-path 校验：符号链接逃逸、
    # 允许根目录外的路径一律拒绝。容器部署必须显式配置；Dockerfile ENTRYPOINT
    # 已强制 /tmp/sources（与 ${java.io.tmpdir} 无关），Compose 也可通过
    # SPRING_APPLICATION_JSON 覆盖。注意 Spring 只对 ${var} 占位符做缺省替换，
    # /tmp/sources 不是 Linux 的 ${java.io.tmpdir}，因此裸机默认根目录实际是
    # /tmp/argus_sources 而非 /tmp/sources——两者只在容器内被 ENTRYPOINT 覆盖统一。
    allowed-source-roots: ${ARGUS_ANALYSIS_ALLOWED_SOURCE_ROOTS:${java.io.tmpdir}/argus_sources}
